<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Student Management</h1>

    <form id="nameAndSectionForm">
        Name:    
        <input type="text" required id="nameInput">

        <br><br>

        Section: 
        <input type="number" required id="sectionInput">     
        <br><br>
        <button type="submit">Submit</button>
    </form>

    <table id="nameAndSectionTable" border="1" style="margin-top: 20px; border-collapse: collapse; width: 50%;">
            <thead>
                <tr>
                <th>Name</th><th>Section</th><th>Action</th>
                </tr>
            </thead>
            <tbody id="nameAndSectionTableBody"> 
            </tbody>
    </table>
</body>
</html>
